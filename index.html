<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
   <title>EV+ - Professional Hyperliquid Onboarding</title>
   <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon/favicon-32x32.png">
   <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon/favicon-16x16.png">
   <link rel="apple-touch-icon" sizes="180x180" href="icons/favicon/apple-touch-icon.png">
   
   <style>
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       :root {
           --primary: #00BF63;
           --primary-dark: #00A056;
           --primary-light: #00D670;
           --bg-dark: #0D0F11;
           --bg-darker: #08090A;
           --card-bg: rgba(13, 15, 17, 0.8);
           --border: rgba(0, 191, 99, 0.2);
           --text-primary: #FFFFFD;
           --text-secondary: #C8CBCE;
           --text-muted: #575A5E;
           --success: #00BF63;
           --error: #EF4444;
           --warning: #F59E0B;
       }
       
       body {
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
           background: var(--bg-darker);
           color: var(--text-primary);
           min-height: 100vh;
           overflow-x: hidden;
           position: relative;
       }

       /* Animated Background */
       body::before {
           content: '';
           position: fixed;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           background: 
               radial-gradient(circle at 20% 50%, rgba(0, 191, 99, 0.08) 0%, transparent 50%),
               radial-gradient(circle at 80% 80%, rgba(0, 191, 99, 0.05) 0%, transparent 50%),
               radial-gradient(circle at 40% 20%, rgba(0, 191, 99, 0.06) 0%, transparent 50%);
           animation: gradient-shift 15s ease infinite;
           z-index: 0;
       }

       @keyframes gradient-shift {
           0%, 100% { opacity: 1; transform: scale(1); }
           50% { opacity: 0.8; transform: scale(1.1); }
       }

       .app-container {
           position: relative;
           z-index: 1;
           max-width: 900px;
           margin: 0 auto;
           padding: 2rem 1rem;
           min-height: 100vh;
       }

       /* Header */
       .header {
           display: flex;
           justify-content: center;
           align-items: center;
           margin-bottom: 3rem;
           padding: 1.5rem 2rem;
           background: var(--card-bg);
           backdrop-filter: blur(20px);
           border-radius: 1rem;
           border: 1px solid rgba(87, 90, 94, 0.3);
           position: relative;
           z-index: 100;
       }

       .logo {
           display: flex;
           align-items: center;
           justify-content: center;
       }

       .wallet-badge-container {
           position: absolute;
           right: 2rem;
           top: 50%;
           transform: translateY(-50%);
       }

       .logo > div {
           display: flex;
           flex-direction: column;
       }

       .logo-image {
           width: 72px;
           height: 72px;
           object-fit: contain;
           filter: drop-shadow(0 0 4px rgba(0, 191, 99, 0.15));
       }

       .logo-text {
           font-size: 2.5rem;
           font-weight: 900;
           background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
           letter-spacing: -0.02em;
       }

       .logo-tagline {
           font-size: 0.875rem;
           color: var(--text-secondary);
           margin-top: -0.25rem;
       }

       .wallet-badge {
           display: flex;
           align-items: center;
           gap: 0.5rem;
           padding: 0.75rem 1.25rem;
           background: rgba(87, 90, 94, 0.2);
           border: 1px solid rgba(200, 203, 206, 0.3);
           border-radius: 2rem;
           font-size: 0.875rem;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.2s ease;
       }

       .wallet-badge:hover {
           background: rgba(87, 90, 94, 0.3);
           border-color: var(--primary);
           transform: translateY(-1px);
       }

       .wallet-indicator {
           width: 8px;
           height: 8px;
           background: var(--primary);
           border-radius: 50%;
           animation: pulse-glow 2s ease-in-out infinite;
       }

       .disconnect-dropdown {
           position: absolute;
           top: calc(100% + 0.5rem);
           right: 0;
           background: rgba(13, 15, 17, 0.98);
           backdrop-filter: blur(20px);
           border: 1px solid var(--primary);
           border-radius: 0.75rem;
           padding: 0.5rem;
           min-width: 180px;
           box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
           z-index: 9999;
           animation: slideDown 0.2s ease;
       }

       @keyframes slideDown {
           from {
               opacity: 0;
               transform: translateY(-10px);
           }
           to {
               opacity: 1;
               transform: translateY(0);
           }
       }

       .disconnect-btn {
           width: 100%;
           padding: 0.75rem 1rem;
           background: rgba(239, 68, 68, 0.1);
           border: 1px solid rgba(239, 68, 68, 0.3);
           border-radius: 0.5rem;
           color: #FCA5A5;
           font-size: 0.875rem;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.2s ease;
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 0.5rem;
           position: relative;
           z-index: 1;
           pointer-events: auto;
       }

       .disconnect-btn:hover {
           background: rgba(239, 68, 68, 0.2);
           border-color: #EF4444;
           color: #EF4444;
       }

       /* Stepper */
       .stepper {
           display: flex;
           justify-content: space-between;
           margin-bottom: 3rem;
           position: relative;
       }

       .stepper::before {
           content: '';
           position: absolute;
           top: 28px;
           left: 56px;
           right: 56px;
           height: 2px;
           background: linear-gradient(90deg, rgba(87, 90, 94, 0.3) 0%, rgba(200, 203, 206, 0.4) 100%);
           z-index: 0;
       }

       .step {
           flex: 1;
           display: flex;
           flex-direction: column;
           align-items: center;
           gap: 0.75rem;
           cursor: pointer;
           transition: all 0.3s ease;
           position: relative;
           z-index: 1;
       }

       .step-number {
           width: 56px;
           height: 56px;
           border-radius: 50%;
           background: var(--bg-dark);
           border: 2px solid rgba(87, 90, 94, 0.4);
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 1.5rem;
           transition: all 0.3s ease;
       }

       .step-number img {
           width: 32px;
           height: 32px;
           object-fit: contain;
           filter: brightness(0.85) grayscale(0.6) opacity(0.6);
           transition: filter 0.3s ease;
       }

       .step.active .step-number {
           background: linear-gradient(135deg, rgba(200, 203, 206, 0.3) 0%, rgba(87, 90, 94, 0.4) 100%);
           border-color: rgba(200, 203, 206, 0.6);
           box-shadow: 0 0 15px rgba(200, 203, 206, 0.2);
           transform: scale(1.15);
       }

       .step.active .step-number img {
           width: 34px;
           height: 34px;
           filter: brightness(1.1) grayscale(0) opacity(1) drop-shadow(0 0 2px rgba(255, 255, 255, 0.3));
       }

       .step.completed .step-number {
           background: linear-gradient(135deg, rgba(200, 203, 206, 0.25) 0%, rgba(87, 90, 94, 0.35) 100%);
           border-color: rgba(200, 203, 206, 0.5);
           box-shadow: 0 0 12px rgba(200, 203, 206, 0.15);
       }

       .step.completed .step-number img {
           width: 34px;
           height: 34px;
           filter: brightness(1) grayscale(0) opacity(0.95) drop-shadow(0 0 2px rgba(255, 255, 255, 0.2));
       }

       .step-title {
           font-size: 0.875rem;
           color: var(--text-secondary);
           text-align: center;
           font-weight: 500;
       }

       .step.active .step-title {
           color: var(--text-primary);
           font-weight: 600;
       }

       /* Main Card */
       .main-card {
           background: var(--card-bg);
           backdrop-filter: blur(20px);
           border-radius: 1.5rem;
           border: 1px solid rgba(87, 90, 94, 0.3);
           padding: 3rem;
           box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
           min-height: 500px;
           display: flex;
           flex-direction: column;
       }

       .step-content {
           flex: 1;
           display: flex;
           flex-direction: column;
           animation: fadeInUp 0.5s ease;
       }

       @keyframes fadeInUp {
           from { opacity: 0; transform: translateY(20px); }
           to { opacity: 1; transform: translateY(0); }
       }

       @keyframes fadeIn {
           from { opacity: 0; }
           to { opacity: 1; }
       }

       .step-content h2 {
           font-size: 2rem;
           font-weight: 700;
           margin-bottom: 1rem;
           background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-light) 100%);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           background-clip: text;
       }

       .step-description {
           color: var(--text-secondary);
           font-size: 1.125rem;
           margin-bottom: 2rem;
           line-height: 1.6;
       }

       /* Buttons */
       .btn-primary, .btn-secondary {
           padding: 1rem 2rem;
           border-radius: 0.75rem;
           font-weight: 600;
           font-size: 1rem;
           cursor: pointer;
           border: none;
           transition: all 0.3s ease;
           position: relative;
           overflow: hidden;
       }

       .btn-primary {
           background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
           color: white;
           box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
       }

       .btn-primary:hover:not(:disabled) {
           transform: translateY(-2px);
           box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
       }

       .btn-primary:active:not(:disabled) {
           transform: translateY(0);
       }

       .btn-primary:disabled {
           opacity: 0.5;
           cursor: not-allowed;
       }

       .btn-large {
           width: 100%;
           padding: 1.25rem 2rem;
           font-size: 1.125rem;
           margin-top: auto;
       }

       .btn-secondary {
           background: rgba(148, 163, 184, 0.1);
           color: var(--text-secondary);
           border: 1px solid rgba(148, 163, 184, 0.2);
       }

       .btn-secondary:hover {
           background: rgba(148, 163, 184, 0.2);
           color: var(--text-primary);
       }

       /* Info Boxes */
       .info-box {
           background: rgba(87, 90, 94, 0.15);
           border: 1px solid rgba(87, 90, 94, 0.3);
           border-radius: 1rem;
           padding: 1.5rem;
           margin-bottom: 2rem;
       }

       .info-box p {
           color: var(--text-secondary);
           margin: 0.35rem 0;
           line-height: 1.5;
       }

       .info-row {
           display: flex;
           justify-content: space-between;
           align-items: center;
           padding: 0.75rem 0;
           border-bottom: 1px solid rgba(148, 163, 184, 0.1);
       }

       .info-row:last-child {
           border-bottom: none;
       }

       .info-row code {
           background: rgba(0, 0, 0, 0.4);
           padding: 0.25rem 0.75rem;
           border-radius: 0.5rem;
           font-family: 'Monaco', 'Courier New', monospace;
           font-size: 0.875rem;
           color: var(--text-secondary);
       }

       /* Balance Grid */
       .balance-grid {
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 1rem;
           margin-bottom: 2rem;
       }

       .balance-card {
           background: rgba(87, 90, 94, 0.15);
           border: 1px solid rgba(87, 90, 94, 0.3);
           border-radius: 1rem;
           padding: 1.5rem;
           text-align: center;
       }

       .balance-label {
           font-size: 0.875rem;
           color: var(--text-secondary);
           margin-bottom: 0.5rem;
       }

       .balance-value {
           color: var(--primary);
       }

       /* Alerts */
       .alert {
           padding: 0.875rem 1.25rem;
           border-radius: 0.75rem;
           margin-top: 1.5rem;
           display: block;
           line-height: 1.6;
           animation: slideIn 0.3s ease;
           white-space: normal;
           word-wrap: break-word;
           overflow-wrap: break-word;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
           font-size: 0.875rem;
       }

       @keyframes slideIn {
           from { opacity: 0; transform: translateX(-10px); }
           to { opacity: 1; transform: translateX(0); }
       }

       .alert-success {
           background: rgba(0, 191, 99, 0.1);
           border: 1px solid rgba(0, 191, 99, 0.3);
           color: var(--primary-light);
       }

       .alert-error {
           background: rgba(239, 68, 68, 0.1);
           border: 1px solid var(--error);
           color: #FCA5A5;
       }

       .alert-warning {
           background: rgba(245, 158, 11, 0.1);
           border: 1px solid var(--warning);
           color: #FCD34D;
       }

       .alert-info {
           background: rgba(87, 90, 94, 0.2);
           border: 1px solid rgba(87, 90, 94, 0.4);
           color: var(--text-secondary);
       }

       /* Completion Step Styles */
       .success-banner {
           text-align: center;
           padding: 2.5rem;
           margin-bottom: 2rem;
           background: linear-gradient(135deg, rgba(0, 191, 99, 0.1) 0%, rgba(0, 191, 99, 0.03) 100%);
           border-radius: 1rem;
           border: 2px solid var(--primary);
           animation: fadeIn 0.5s ease;
           box-shadow: 0 8px 25px rgba(0, 191, 99, 0.15);
       }

       .success-icon-large {
           font-size: 4rem;
           margin-bottom: 1.5rem;
           animation: scaleIn 0.6s ease;
           display: flex;
           align-items: center;
           justify-content: center;
       }

       .success-icon-large img {
           width: 96px;
           height: 96px;
           object-fit: contain;
           filter: brightness(0.95) drop-shadow(0 0 8px rgba(0, 191, 99, 0.25));
       }

       .success-banner h2 {
           font-size: 2.5rem;
           margin-bottom: 0.5rem;
       }

       .success-subtitle {
           font-size: 1.125rem;
           color: var(--text-secondary);
       }

       .credentials-box {
           background: rgba(87, 90, 94, 0.15);
           border: 1px solid rgba(87, 90, 94, 0.3);
           border-radius: 1rem;
           padding: 1.5rem;
           margin-bottom: 2rem;
       }

       .credentials-box h3 {
           color: var(--primary);
           margin-bottom: 1.5rem;
           font-size: 1.25rem;
       }

       .credential-item {
           margin-bottom: 1rem;
       }

       .credential-label {
           font-size: 0.875rem;
           color: var(--text-secondary);
           margin-bottom: 0.5rem;
           font-weight: 600;
       }

       .credential-value {
           display: block;
           background: rgba(0, 0, 0, 0.5);
           padding: 0.75rem 1rem;
           border-radius: 0.5rem;
           font-family: 'Monaco', 'Courier New', monospace;
           font-size: 0.875rem;
           color: var(--text-secondary);
           word-break: break-all;
           border: 1px solid rgba(87, 90, 94, 0.4);
       }

       .credential-value.secret {
           background: rgba(239, 68, 68, 0.1);
           border-color: rgba(239, 68, 68, 0.3);
           color: #FCA5A5;
           padding-right: 6rem;
       }

       .reveal-btn {
           position: absolute;
           right: 0.5rem;
           top: 50%;
           transform: translateY(-50%);
           background: rgba(0, 191, 99, 0.2);
           border: 1px solid var(--primary);
           color: var(--primary);
           padding: 0.5rem 1rem;
           border-radius: 0.5rem;
           font-size: 0.875rem;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.2s ease;
           display: flex;
           align-items: center;
           gap: 0.25rem;
       }

       .reveal-btn:hover {
           background: rgba(0, 191, 99, 0.3);
           transform: translateY(-50%) scale(1.05);
       }

       .reveal-btn:active {
           transform: translateY(-50%) scale(0.98);
       }

       .credential-warning {
           background: rgba(245, 158, 11, 0.1);
           border: 1px solid var(--warning);
           color: #FCD34D;
           padding: 0.75rem 1rem;
           border-radius: 0.5rem;
           font-size: 0.875rem;
           margin-top: 1rem;
           text-align: center;
       }

       .balance-section h3 {
           color: var(--primary);
           margin-bottom: 1rem;
           font-size: 1.25rem;
       }

       /* Success Check Animation */
       .success-check {
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           padding: 3rem;
           animation: fadeIn 0.5s ease;
       }

       .check-icon {
           width: 120px;
           height: 120px;
           border-radius: 50%;
           background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
           display: flex;
           align-items: center;
           justify-content: center;
           font-size: 3rem;
           color: white;
           margin-bottom: 1.5rem;
           animation: scaleIn 0.5s ease;
           box-shadow: 0 10px 25px rgba(0, 191, 99, 0.2);
       }

       .check-icon img {
           width: 72px;
           height: 72px;
           object-fit: contain;
           filter: brightness(0.95) drop-shadow(0 0 4px rgba(255, 255, 255, 0.15));
       }

       @keyframes scaleIn {
           from { transform: scale(0); opacity: 0; }
           to { transform: scale(1); opacity: 1; }
       }

       /* Navigation */
       .step-nav {
           display: flex;
           gap: 1rem;
           margin-top: 2rem;
       }

       .step-nav button {
           flex: 1;
       }

       /* Completion Modal */
       .modal-overlay {
           position: fixed;
           top: 0;
           left: 0;
           right: 0;
           bottom: 0;
           background: rgba(0, 0, 0, 0.85);
           backdrop-filter: blur(8px);
           display: flex;
           align-items: center;
           justify-content: center;
           z-index: 10000;
           animation: fadeIn 0.3s ease;
       }

       .modal-content {
           background: rgba(13, 15, 17, 0.98);
           border: 1px solid var(--primary);
           border-radius: 0.25rem;
           max-width: 500px;
           width: 90%;
           box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 191, 99, 0.3);
           animation: slideUp 0.3s ease;
       }

       @keyframes slideUp {
           from {
               opacity: 0;
               transform: translateY(30px);
           }
           to {
               opacity: 1;
               transform: translateY(0);
           }
       }

       .modal-header {
           display: flex;
           align-items: center;
           justify-content: space-between;
           padding: 1.25rem 1.5rem;
           border-bottom: 1px solid rgba(87, 90, 94, 0.3);
       }

       .modal-title {
           font-size: 1.25rem;
           font-weight: 700;
           color: var(--primary);
           margin: 0;
       }

       .modal-close {
           background: transparent;
           border: none;
           color: var(--text-secondary);
           font-size: 1.5rem;
           cursor: pointer;
           padding: 0;
           width: 32px;
           height: 32px;
           display: flex;
           align-items: center;
           justify-content: center;
           transition: all 0.2s ease;
           border-radius: 0.25rem;
       }

       .modal-close:hover {
           color: var(--text-primary);
           background: rgba(87, 90, 94, 0.2);
       }

       .modal-body {
           padding: 1.5rem;
       }

       .modal-text {
           color: var(--text-secondary);
           font-size: 1rem;
           line-height: 1.6;
           margin-bottom: 1.5rem;
           text-align: center;
       }

       .modal-link-button {
           display: flex;
           align-items: center;
           justify-content: center;
           gap: 0.5rem;
           width: 100%;
           padding: 1rem 1.5rem;
           background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
           border: 1px solid var(--primary);
           border-radius: 0.25rem;
           color: white;
           font-weight: 600;
           font-size: 1rem;
           text-decoration: none;
           cursor: pointer;
           transition: all 0.3s ease;
           box-shadow: 0 4px 12px rgba(0, 191, 99, 0.3);
       }

       .modal-link-button:hover {
           transform: translateY(-2px);
           box-shadow: 0 6px 20px rgba(0, 191, 99, 0.4);
           background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
       }

       .modal-link-button:active {
           transform: translateY(0);
       }

       .modal-arrow {
           font-size: 1.25rem;
           transition: transform 0.2s ease;
       }

       .modal-link-button:hover .modal-arrow {
           transform: translateX(4px);
       }

       /* Responsive */
       @media (max-width: 768px) {
           .app-container {
               padding: 1rem;
           }

           .header {
               flex-direction: column;
               gap: 1rem;
               text-align: center;
           }

           .stepper {
               flex-wrap: wrap;
           }

           .step {
               flex: 1 1 40%;
               margin-bottom: 1rem;
           }

           .stepper::before {
               display: none;
           }

           .main-card {
               padding: 1.5rem;
           }

           .balance-grid {
               grid-template-columns: 1fr;
           }

           .logo-text {
               font-size: 2rem;
           }

           .modal-content {
               width: 95%;
               margin: 1rem;
           }
       }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
